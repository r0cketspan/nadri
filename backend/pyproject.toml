[project]
name = "nadri"
version = "0.1.0"
description = "nadri 관광 챗봇 백엔드 (적재·RAG·MCP 툴)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==1.30.0",
    "langchain-mcp-adapters==0.3.2",
    "langchain-core==1.8.4",
    "pydantic-settings==2.16.3",
    "sqlalchemy[asyncio]==2.1.9",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "httpx==0.29.0",
    "jinja2==3.1.6",
    "uvicorn==0.54.0",
]

[project.scripts]
nadri = "nadri.cli:main"
nadri-tools = "nadri.tools.server:main"

[dependency-groups]
reranker = ["torch==2.15.0", "sentence-transformers==6.3.0", "huggingface-hub==2.5.0"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "pyyaml==6.0.4"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nadri"]

[tool.pytest.ini_options]
markers = ["integration: 실 compose·실 키가 필요한 테스트"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
